<nav>
    <a href="index.html">Home</a>
    <a href="writing.html">Writing</a>
    <a href="software.html">Software Development</a>
</nav>

<main>
    <section class="portfolio-section">

        <h1>Writing</h1>

        <div class="filters">
    <button data-filter="All" class="active">All</button>
    <button data-filter="Essays">Essays</button>
    <button data-filter="Articles">Articles</button>
    <button data-filter="Etc">Etc</button>
</div>

        <div id="writing-container"></div>

    </section>
</main>


<script src="js/portfolio.js"></script>

<script>
    const container = document.getElementById("writing-container");
    const filterButtons = document.querySelectorAll(".filters button");

    function renderProjects(filter) {
        container.innerHTML = "";

        const projectsToShow = filter === "All"
            ? writingProjects
            : writingProjects.filter(project => project.tags.includes(filter));

        projectsToShow.forEach(project => {

            container.innerHTML += `
                <div class="portfolio-card">

                    <h2>
                        <a href="${project.link}">
                            ${project.title}
                        </a>
                    </h2>

                    <p>
                        ${project.description}
                    </p>

                </div>
            `;

        });
    }

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            filterButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");
            renderProjects(button.dataset.filter);
        });
    });

    renderProjects("All");
</script>
