<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing</title>
    <link rel="stylesheet" href__="css/style.css">
</head>
<body>

<nav>
    <a href__="index.html">Home</a>
    <a href__="writing.html">Writing</a>
    <a href__="software.html">Software Development</a>
</nav>

<main>
    <section class="portfolio-section">

        <h1>Writing</h1>

        <div class="filters">
            <button data-filter="All" class="active">All</button>
            <button data-filter="Essays">Essays</button>
            <button data-filter="Articles">Articles</button>
            <button data-filter="Etc">Etc</button>
        </div>

        <div id="writing-container"></div>

    </section>
</main>

<script src="js/portfolio.js"></script>

<script>
    const container = document.getElementById("writing-container");

    // Generate the cards, tagging each with all its tags as classes
    writingProjects.forEach(project => {
        const tagClasses = (project.tags || []).join(" ");
        container.innerHTML += `
            <div class="portfolio-card ${tagClasses}" data-tags='${JSON.stringify(project.tags || [])}'>
                <h2>
                    <a href__="${project.link}">
                        ${project.title}
                    </a>
                </h2>
                <p>
                    ${project.description}
                </p>
            </div>
        `;
    });

    // Filter logic — matches button data-filter to the card's tags
    const filterButtons = document.querySelectorAll(".filters button");
    const cards = document.querySelectorAll(".portfolio-card");

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            const filter = button.getAttribute("data-filter");

            // toggle active state on buttons
            filterButtons.forEach(b => b.classList.remove("active"));
            button.classList.add("active");

            // show/hide cards based on tag match
            cards.forEach(card => {
                const tags = JSON.parse(card.getAttribute("data-tags"));
                if (filter === "All" || tags.includes(filter)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }
            });
        });
    });
</script>

</body>
</html>
