<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | Jeremy Jackson</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="writing.html">Writing</a>
        <a href="software.html">Software Development</a>
    </nav>


    <main>

        <section class="portfolio-section">

            <h1>Writing</h1>


            <div class="filters">

                <button data-filter="All">All</button>
                <button data-filter="Essays">Essays</button>
                <button data-filter="Articles">Articles</button>
                <button data-filter="Etc">Etc</button>

            </div>


            <div id="writing-container"></div>


        </section>

    </main>


    <script src="js/portfolio.js"></script>


    <script>

        const container = document.getElementById("writing-container");
        const buttons = document.querySelectorAll(".filters button");


        function displayProjects(filter = "All") {

            container.innerHTML = "";


            writingProjects.forEach(project => {


                if (
                    filter !== "All" &&
                    !project.tags.includes(filter)
                ) {
                    return;
                }


                container.innerHTML += `

                    <div class="portfolio-card">


                        <h2>

                            <a href="${project.link}">

                                ${project.title}

                            </a>

                        </h2>


                        <p>

                            ${project.description}

                        </p>


                    </div>

                `;


            });

        }


        buttons.forEach(button => {

            button.addEventListener("click", () => {

                displayProjects(button.dataset.filter);

            });

        });


        displayProjects();


    </script>


</body>

</html>
