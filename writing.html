<nav>
    <a href="index.html">Home</a>
    <a href="writing.html">Writing</a>
    <a href="software.html">Software Development</a>
</nav>

<main>
    <section class="portfolio-section">

        <h1>Writing</h1>

        <div class="filters">
    <button data-filter="All">All</button>
    <button data-filter="Essays">Essays</button>
    <button data-filter="Articles">Articles</button>
    <button data-filter="Etc">Etc</button>
</div>

        <div id="writing-container"></div>

    </section>
</main>


<script src="js/portfolio.js"></script>

<script>
    const container = document.getElementById("writing-container");

    writingProjects.forEach(project => {

        container.innerHTML += `
            <div class="portfolio-card">

                <h2>
                    <a href="${project.link}">
                        ${project.title}
                    </a>
                </h2>

                <p>
                    ${project.description}
                </p>

            </div>
        `;

    });
</script>
